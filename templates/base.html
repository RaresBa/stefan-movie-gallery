<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Stefan Movie Gallery: save movies and keep track of what you have watched."
  >

  <title>
    {% block title %}Stefan Movie Gallery{% endblock %}
  </title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >
</head>

<body>
  <a class="skip-link" href="#main-content">
    Skip to content
  </a>

  <header class="site-header">
    <div class="container header-inner">
      <a
        class="brand"
        href="{{ url_for('index') }}"
        aria-label="Stefan Movie Gallery home"
      >
        <svg
          class="brand-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="4"
            width="18"
            height="16"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"
            stroke="currentColor"
            stroke-width="1.7"
          />
        </svg>

        Stefan Movie Gallery
      </a>

      <span class="header-note">
        A place for your next good film.
      </span>
    </div>
  </header>

  <main id="main-content" class="container site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        &copy; 2026 Stefan Movie Gallery. All rights reserved.
      </p>
    </div>
  </footer>
</body>
</html>
